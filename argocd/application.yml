apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: numeraid
  namespace: argocd
spec:
  project: default
  source:
    repoURL: "https://github.com/numeraid/identity-and-access-management-database-k8s"
    targetRevision: HEAD
    path: base
  destination:
    server: "https://kubernetes.default.svc"
    namespace: numeraid-data
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  syncOptions:
    - CreateNamespace=true
    - PruneLast=true